# dsh-eli-mode bundle patch — host 平面挂载点
# eli-kb：知识库服务；eli-web-routes：知识库网页/立绘/API；eli-mode：host 入口
# （设置命名空间注册 + 预设同步 + 默认知识库播种）。
- insert:
    - id: eli-kb
      name: 'dsh-eli-mode/lib/kb.js'

- insert:
    - id: eli-web-routes
      name: 'dsh-eli-mode/lib/web-routes.js'

- insert:
    - id: eli-mode
      name: 'dsh-eli-mode'

# 撤销 web-app 对 base 工具行的 disabled：tool-fs / tool-fs-search 回归 global 层，
# 使其 tool:* 引导 section 注册在 global 层，preset 层由 prompt-trim 同名遮蔽（跨层遮蔽不冲突）。
- id: tool-fs

- id: tool-fs-search
