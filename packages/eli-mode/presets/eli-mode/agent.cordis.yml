# Eli Mode — 通用 Agent 预设。
#
# 设计要点：
# - 人设：Eli，一个 AI Agent；简洁直接不冗余；知识库（wiki）驱动记忆。
# - 工具：文件、Shell、Web 搜索、目标、子代理(spawn)、后台任务、澄清提问。
# - 砍掉：计划模式、技能库(skill)、工作流、todo、ralph、fork、codex、claude-code、bash。
# - 知识库：host 侧 dsh-eli-mode/lib/kb.js 提供服务（跨会话共享 + 网页读写），
#   这里只挂工具与注入段；会话只注入 wiki 目录页，细节用 kb_read / kb_search 按需取用。
# - 压缩：原生阈值(0.8/0.16/8192) + 专属中文摘要器 dsh-eli-mode/lib/compaction.js。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      Role: Eli
      工作目录 {{cwd}}，今天是 {{date}}。

      {{elipersona}}
    # 注意：complete 保持 false、includeRuntimeContext 保持 true（默认），
    # 这样 cwd/日期时间仍由运行时上下文注入；{{cwd}}/{{date}} 由 wiki-index 插件保障可解析。
    # 人格正文（{{elipersona}}）由 eli-mode 模块从 ~/.dsh/settings.yaml 的
    # eli-mode.personaPrompt 读取（插件-插件配置 → eli-mode 管理页可编辑）。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
# Windows 上没有 bash；minimal 自带的 bash 持久终端换成本机可用的 pwsh 工具。
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── web search ──────────────────────────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── ask user ────────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── delegation（只挂 spawn 子代理；不挂 fork / codex / claude-code）─────────

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

# ── knowledge base tools（消费 host 侧 eliKb 服务）─────────────────────────

- id: kb-tools
  name: 'dsh-eli-mode/lib/kb-tools.js'

# ── wiki index injection（会话只注入目录页 + {{date}} 变量）────────────────

- id: wiki-index
  name: 'dsh-eli-mode/lib/wiki-index.js'

# ── eli-mode 管理页变量（人格正文取设置命名空间，见插件-插件配置 → eli-mode）──

- id: eli-mode
  name: 'dsh-eli-mode/lib/eli-mode.js'

# ── compaction（原生阈值 + 专属中文摘要器）─────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: eli-compaction
      name: 'dsh-eli-mode/lib/compaction.js'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
